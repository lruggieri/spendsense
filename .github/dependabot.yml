version: 2
updates:
  # Keeps the SHA-pinned actions (and their `# vN` comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: a hijacked release is usually caught by then.
    cooldown:
      default-days: 7
  # Keeps the digest-pinned python base image current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
